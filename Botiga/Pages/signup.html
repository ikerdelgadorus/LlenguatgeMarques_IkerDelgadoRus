<!DOCTYPE html>
<html>
    <head>
        <title>Mr. Watch - Sign Up</title>
        <link rel="icon" type="image/png" href="../MULTIMEDIA/IMAGES/MrWatchLogo.png">
        <meta charset="utf8">
        <link rel="stylesheet" href="../CSS/style.css">
    </head>
    <body>
        <!-- header defineix una zona a dins del body, sempre a la part superior-->
        <header>
            <!-- definim un navegador, com si fora una llista per ara les referencies no apunten enlloc-->
            <!--<nav>
                <li><a href="../index.html">Inici</a></li>
                <li><a href="#">Productes</a></li>
                <li><a href="#">Serveis</a></li>
                <li><a href="#">Contacte</a></li>
            </nav>-->
            <a href="../index.html"><img src="../MULTIMEDIA/IMAGES/Mr.Watch.png" alt="Mr.Watch_Logo" class="logo"></a>
            <div class="icons">
                <a href="signin.html"><img src="../MULTIMEDIA/IMAGES/Diseño sin título (2).png" alt="User_Icon" class="icon"></a>
            </div>  

        </header>


        <!-- deifnim una nova etiqueta section (similar al div)-->
        <section class="centerSection"> 
            <form class="login">
                <h3>CREATE AN ACCOUNT</h3>
                <p>First name</p>
                <input class="text" type="text">
                <p>Last name</p>
                <input class="text" type="text">
                <p>Country</p>
                <select class="country" name="country">
                    <option value="">-- Select a country --</option>
                    <option value="Argentina">Argentina</option>
                    <option value="Australia">Australia</option>
                    <option value="Austria">Austria</option>
                    <option value="Belgium">Belgium</option>
                    <option value="Brazil">Brazil</option>
                    <option value="Canada">Canada</option>
                    <option value="China">China</option>
                    <option value="Denmark">Denmark</option>
                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="India">India</option>
                    <option value="Indonesia">Indonesia</option>
                    <option value="Ireland">Ireland</option>
                    <option value="Italy">Italy</option>
                    <option value="Japan">Japan</option>
                    <option value="Mexico">Mexico</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="Norway">Norway</option>
                    <option value="Poland">Poland</option>
                    <option value="Saudi Arabia">Saudi Arabia</option>
                    <option value="South Africa">South Africa</option>
                    <option value="South Korea">South Korea</option>
                    <option value="Spain">Spain</option>
                    <option value="Sweden">Sweden</option>
                    <option value="Switzerland">Switzerland</option>
                    <option value="Thailand">Thailand</option>
                    <option value="Turkey">Turkey</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="United States">United States</option>
                </select>
                <p>Email</p>
                <input class="text" type="email">
                <p>Password</p>
                <input class="text" type="password">
                <p>Confirm password</p>
                <input class="text" type="password">
                <input class="button" type="button" value="Log in">
            </form>
        </section>

        <footer class="footerWhite">
            <p>&copy;2025 Mr. Watch</p>
        </footer>

    </body>
</html>
